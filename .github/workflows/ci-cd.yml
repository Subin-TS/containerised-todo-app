name: CI-CD

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:
          python-version: '3.12'

      - name: Install Dependencies

        run: |
          pip install -r app/requirements.txt

      - name: Run Tests

        run: pytest

      - name: Login DockerHub

        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image

        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/todo-app:${{ github.run_number }} .

      - name: Push Image

        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/todo-app:${{ github.run_number }}
